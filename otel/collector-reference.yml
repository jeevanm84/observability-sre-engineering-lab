receivers:
  otlp:
    protocols: {grpc: {}, http: {}}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 512}
  batch: {}
  attributes/redact:
    actions:
      - {key: enduser.email, action: delete}
      - {key: http.request.header.authorization, action: delete}
exporters:
  debug: {verbosity: basic}
service:
  pipelines:
    metrics: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}
    logs: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}
    traces: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}

